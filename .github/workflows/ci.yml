name: VOJAS CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  NODE_VERSION: "20"

jobs:
  # ── Backend: typecheck + build ────────────────────────────────────────────
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Typecheck
        working-directory: backend
        run: npx tsc --noEmit

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Smoke test (boot then kill)
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: file:./prisma/test.db
          JWT_SECRET: test-secret-with-at-least-thirty-two-characters-okay-yes
          PORT: 5000
        run: |
          npx prisma db push --skip-generate
          node dist/server.js &
          SERVER_PID=$!
          sleep 3
          curl -fsS http://localhost:5000/api/v1/health | tee /tmp/health.json
          kill $SERVER_PID || true
          grep -q '"success":true' /tmp/health.json

  # ── Frontend: typecheck + build ───────────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Verify build artifacts
        working-directory: frontend
        run: |
          test -f dist/index.html
          test -d dist/assets
          echo "Bundle size:"
          du -sh dist/

  # ── Docker: build & smoke test the production image ──────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: vojas-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: vojas-frontend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Security audit ───────────────────────────────────────────────────────
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Backend audit
        working-directory: backend
        run: |
          if [ -f package-lock.json ]; then
            npm audit --audit-level=high
          fi

      - name: Frontend audit
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm audit --audit-level=high
          fi
        continue-on-error: false

  # ── Final status check ───────────────────────────────────────────────────
  ci-pass:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker, audit]
    if: success()
    steps:
      - name: ✓ Status banner
        run: |
          echo "## ✅ CI Pipeline Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Backend typecheck + build" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend typecheck + build" >> $GITHUB_STEP_SUMMARY
          echo "- Docker images built" >> $GITHUB_STEP_SUMMARY
          echo "- Security audit clean" >> $GITHUB_STEP_SUMMARY
