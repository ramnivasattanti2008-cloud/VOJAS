name: VOJAS CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  NODE_VERSION: "20"

jobs:
  # ── Monorepo Build & Typecheck ────────────────────────────────────────────
  build-and-verify:
    name: Build & Verify Monorepo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @vojas/db exec prisma generate

      - name: Build Shared Packages
        run: |
          pnpm --filter @vojas/shared build
          pnpm --filter @vojas/domain build
          pnpm --filter @vojas/api-client build

      - name: Typecheck Backend API
        run: pnpm --dir apps/api exec tsc --noEmit

      - name: Typecheck Next.js Web
        run: pnpm --dir apps/web exec tsc --noEmit

      - name: Build Next.js Web
        run: pnpm --filter @vojas/web build

  # ── Docker Build Verification ─────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-verify
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Root API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: vojas-api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Final status check ───────────────────────────────────────────────────
  ci-pass:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [build-and-verify, docker]
    if: success()
    steps:
      - name: Status banner
        run: |
          echo "## ✅ VOJAS CI Pipeline Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Monorepo dependencies resolved" >> $GITHUB_STEP_SUMMARY
          echo "- Shared packages built" >> $GITHUB_STEP_SUMMARY
          echo "- API and Web TypeScript verification clean" >> $GITHUB_STEP_SUMMARY
          echo "- Next.js production build succeeded" >> $GITHUB_STEP_SUMMARY
          echo "- Docker production image verified" >> $GITHUB_STEP_SUMMARY
