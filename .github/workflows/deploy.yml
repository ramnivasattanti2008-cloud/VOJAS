name: Deploy to Production

# Auto-deploys on every push to master/main.
# For each platform, add the required secret to GitHub:
#   Settings → Secrets and variables → Actions
#
# ── Vercel (Frontend) ──────────────────────────────────────────
#   Add secret: VERCEL_TOKEN (from vercel.com/account/tokens)
#   Frontend auto-deploys via Vercel GitHub App (vercel.com → GitHub integration)
#
# ── Render (Backend) ────────────────────────────────────────────
#   Add secret: RENDER_DEPLOY_HOOK (from Render dashboard → your backend → Deploy Hooks)
#
# ── Cyclic (Backend — free always-on) ──────────────────────────
#   Add secret: CYCLIC_APP_ID (your Cyclic app slug, e.g. "vojas-backend")
#   Cyclic auto-deploys when you connect the GitHub repo in Cyclic dashboard
#
# ── Fly.io (Backend — free tier) ───────────────────────────────
#   Add secrets: FLY_API_TOKEN (from fly.io/account/tokens)
#   Deploys the GHCR image built in the "build" job
#
# ── Railway (Backend) ──────────────────────────────────────────
#   Add secret: RAILWAY_DEPLOY_HOOK (from Railway dashboard → your project → Deploy hooks)
#
# ── Self-hosted (VPS via SSH) ─────────────────────────────────
#   Add secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY

on:
  push:
    branches: [master, main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - "render.yaml"
      - "cyclic.json"
      - "fly.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}-frontend

jobs:
  # ── Build & push container images ────────────────────────────────
  build:
    name: Build images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend_tag: ${{ steps.meta.outputs.backend_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta (backend)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy backend to all configured platforms ────────────────────
  deploy-backend:
    name: Deploy backend
    runs-on: ubuntu-latest
    needs: build
    steps:
      # ── Render ───────────────────────────────────────────────────
      - name: Deploy to Render
        if: vars.RENDER_DEPLOY_HOOK != ''
        run: |
          echo "Triggering Render deploy…"
          curl -fsS -X POST "${{ vars.RENDER_DEPLOY_HOOK }}"
          echo "Done."

      # ── Railway ─────────────────────────────────────────────────
      - name: Deploy to Railway
        if: vars.RAILWAY_DEPLOY_HOOK != ''
        run: |
          echo "Triggering Railway deploy…"
          curl -fsS -X POST "${{ vars.RAILWAY_DEPLOY_HOOK }}"
          echo "Done."

      # ── Fly.io ──────────────────────────────────────────────────
      - name: Deploy to Fly.io
        if: secrets.FLY_API_TOKEN != ''
        uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          args: "deploy --image ${{ needs.build.outputs.backend_tag }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # ── Self-hosted SSH ─────────────────────────────────────────
      - name: Deploy via SSH
        if: secrets.DEPLOY_SSH_KEY != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHITHUB_TOKEN }}
            docker pull ${{ env.BACKEND_IMAGE }}:latest
            docker compose up -d backend
            docker image prune -f

  # ── Deploy frontend to Vercel ───────────────────────────────────
  deploy-frontend:
    name: Deploy frontend to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          vercel-args: "--prod"
