name: Deploy to Production

on:
  push:
    branches: [master, main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "packages/**"
      - "docker-compose.yml"
      - "Dockerfile"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}-api

jobs:
  # ── Build & push container image ────────────────────────────────
  build:
    name: Build & push container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.repository_owner != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta (backend)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy backend to configured platforms ───────────────────────
  deploy-backend:
    name: Deploy backend
    runs-on: ubuntu-latest
    needs: build
    steps:
      # ── Render ───────────────────────────────────────────────────
      - name: Deploy to Render
        if: vars.RENDER_DEPLOY_HOOK != ''
        run: |
          echo "Triggering Render deploy…"
          curl -fsS -X POST "${{ vars.RENDER_DEPLOY_HOOK }}"
          echo "Render deploy triggered."

      # ── Railway ─────────────────────────────────────────────────
      - name: Deploy to Railway
        if: vars.RAILWAY_DEPLOY_HOOK != ''
        run: |
          echo "Triggering Railway deploy…"
          curl -fsS -X POST "${{ vars.RAILWAY_DEPLOY_HOOK }}"
          echo "Railway deploy triggered."

      # ── Fly.io ──────────────────────────────────────────────────
      - name: Deploy to Fly.io
        if: secrets.FLY_API_TOKEN != ''
        uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          args: "deploy --image ${{ needs.build.outputs.backend_tag }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # ── Self-hosted SSH ─────────────────────────────────────────
      - name: Deploy via SSH
        if: secrets.DEPLOY_SSH_KEY != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            docker pull ${{ env.BACKEND_IMAGE }}:latest
            docker compose up -d backend
            docker image prune -f

  # ── Deploy frontend to Vercel (Only if VERCEL_TOKEN secret configured) ───
  deploy-frontend:
    name: Deploy frontend to Vercel
    runs-on: ubuntu-latest
    if: secrets.VERCEL_TOKEN != ''
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./apps/web
          vercel-args: "--prod"
