name: Keep backend warm

# Render's free tier spins a web service down after ~15 minutes of inactivity,
# and the next request then pays a ~50-60 second cold start. For a public
# transparency site that means a citizen (or a judge opening the demo) sees a
# minute of hanging requests and timeout errors before anything loads.
#
# Pinging the liveness endpoint on a schedule keeps the instance resident.
# /health is deliberately used rather than an API route: it does no database
# work, so this costs the service almost nothing.
#
# Note: GitHub's scheduled runners are best-effort and can be delayed under
# load, so the interval is set tighter than the 15 minute idle window.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 \
              https://vojas-backend.onrender.com/health || echo 000)
            echo "attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "Backend did not return 200 after 3 attempts"
          exit 1
