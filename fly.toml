# Fly.io configuration for VOJAS backend
# Free tier: 3 shared VMs, 160GB bandwidth/month, 1GB storage
#
# Deploy steps:
#   1. Install flyctl: npm i -g flyctl
#   2. fly auth login
#   3. fly launch --image ghcr.io/ramnivasattanti2008-cloud/vojas-backend:latest --no-deploy
#   4. fly secrets set DATABASE_URL="postgresql://..." JWT_SECRET="your-32-char-secret" CLIENT_BASE_URL="https://vojas-frontend.vercel.app"
#   5. fly deploy
#
# Or use the Dockerfile.app for multi-stage build on Fly:
#   fly launch --dockerfile Dockerfile.app --no-deploy

app = "vojas-backend"
primary_region = "lax"
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  image = "ghcr.io/ramnivasattanti2008-cloud/vojas-backend:latest"

[deploy]
  release_command = "npx prisma migrate deploy"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # keep warm (free tier: 3 shared VMs)
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

# Health check
[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  path = "/api/v1/health"
  timeout = "2s"
