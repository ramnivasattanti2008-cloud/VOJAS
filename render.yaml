# Render Blueprint — one-click deploy to https://render.com
#
# Render auto-detects this file on push to GitHub. Visit:
#   https://dashboard.render.com/blueprints
#
# Usage:
#   1. Push this file (and the rest of the repo) to GitHub
#   2. Sign in to Render and go to "Blueprints" → "Create Blueprint Instance"
#   3. Select your repo — Render will pick up this file and provision
#      the database, backend, and frontend services.
#
# The backend uses a Docker runtime (built from ./backend/Dockerfile).
# The frontend is a static site served directly by Render's CDN.

services:
  # ── Managed PostgreSQL ────────────────────────────────────────────────────
  - type: pserv
    name: vojas-db
    plan: starter
    env: docker
    region: oregon
    # Render manages the database, including backups and high availability.
    # We reference it as `vojas-db.internal` from inside the Render network.

  # ── Backend API ──────────────────────────────────────────────────────────
  - type: web
    name: vojas-backend
    plan: starter
    runtime: docker
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    # NOTE: apps/api/Dockerfile does not exist yet. See DEPLOY-STATUS.md "Issue 6".
    # Until then, set Render to use a "Node" runtime with:
    #   Build Command: pnpm install --frozen-lockfile && pnpm --filter @vojas/api build
    #   Start Command: cd apps/api && node dist/server.js
    #   Health Check: /api/v1/health
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromService: { type: pserv, name: vojas-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true   # auto-generated on first deploy
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: BCRYPT_ROUNDS
        value: 10
      - key: CLIENT_BASE_URL
        value: https://vojas-frontend.onrender.com
      - key: PORT
        value: 10000
      - key: SEED_ON_BOOT
        value: "true"
      # ── Redis (M19: BullMQ + distributed cache) ────────────────────────
      # To enable Redis-backed job queue + cache on Render:
      #   1. Provision an Upstash Redis (free): https://upstash.com/
      #   2. Copy the connection URL (looks like: redis://default:xxxx@xxx.upstash.io:6379)
      #   3. Add a "Secret File" or "Environment Variable" with key REDIS_URL
      #   4. App auto-detects Redis on boot and switches from in-memory to Redis.
      # If REDIS_URL is not set, the API uses in-memory implementations
      # (suitable for single-instance dev/staging; NOT for multi-instance prod).
      - key: REDIS_URL
        sync: false   # Set this manually in Render dashboard with your Upstash URL
    autoDeploy: true

  # ── Frontend (static) ────────────────────────────────────────────────────
  - type: web
    name: vojas-frontend
    plan: free
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://vojas-backend.onrender.com/api/v1
      - key: VITE_APP_NAME
        value: VOJAS
      - key: VITE_ENABLE_RQ_DEVTOOLS
        value: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true
