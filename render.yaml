# Render Blueprint — one-click deploy to https://render.com
#
# Render auto-detects this file on push to GitHub. Visit:
#   https://dashboard.render.com/blueprints
#
# Usage:
#   1. Push this file (and the rest of the repo) to GitHub
#   2. Sign in to Render and go to "Blueprints" → "Create Blueprint Instance"
#   3. Select your repo — Render will pick up this file and provision
#      the database, backend, and frontend services.
#
# The backend uses a Docker runtime (built from ./backend/Dockerfile).
# The frontend is a static site served directly by Render's CDN.

services:
  # ── Managed PostgreSQL ────────────────────────────────────────────────────
  - type: pserv
    name: vojas-db
    plan: starter
    env: docker
    region: oregon
    # Render manages the database, including backups and high availability.
    # We reference it as `vojas-db.internal` from inside the Render network.

  # ── Backend API ──────────────────────────────────────────────────────────
  - type: web
    name: vojas-backend
    plan: starter
    runtime: docker
    # apps/api/Dockerfile now exists (built and verified locally via
    # `docker build -f apps/api/Dockerfile .` from the repo root). It is a
    # pnpm WORKSPACE package — @vojas/api depends on @vojas/db,
    # @vojas/domain, @vojas/shared via workspace:* — so the Docker build
    # context must be the repo root, not apps/api/, or it cannot see the
    # other workspace packages or pnpm-workspace.yaml. rootDir is
    # deliberately NOT set on this service (it would make Render use
    # apps/api/ as the context and the build would fail); dockerContext and
    # dockerfilePath are both relative to the repo root instead.
    dockerContext: .
    dockerfilePath: ./apps/api/Dockerfile
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromService: { type: pserv, name: vojas-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true   # auto-generated on first deploy
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: BCRYPT_ROUNDS
        value: 10
      - key: CLIENT_BASE_URL
        value: https://vojas-frontend.onrender.com
      - key: PORT
        value: 10000
      - key: SEED_ON_BOOT
        value: "true"
      # ── Redis (M19: BullMQ + distributed cache) ────────────────────────
      # To enable Redis-backed job queue + cache on Render:
      #   1. Provision an Upstash Redis (free): https://upstash.com/
      #   2. Copy the connection URL (looks like: redis://default:xxxx@xxx.upstash.io:6379)
      #   3. Add a "Secret File" or "Environment Variable" with key REDIS_URL
      #   4. App auto-detects Redis on boot and switches from in-memory to Redis.
      # If REDIS_URL is not set, the API uses in-memory implementations
      # (suitable for single-instance dev/staging; NOT for multi-instance prod).
      - key: REDIS_URL
        sync: false   # Set this manually in Render dashboard with your Upstash URL
    autoDeploy: true

  # ── Frontend (static) — STALE, describes a different app ─────────────────
  # This block deploys a Vite/React SPA from `rootDir: frontend` (npm build,
  # a `dist/` static output, VITE_* env vars). CLAUDE.md documents `frontend/`
  # as "a leftover v1 directory with no package.json" — this build would
  # fail outright, and even if it built something, it would not be the real
  # app. The current frontend is `apps/web`, a Next.js 15 app with server
  # rendering and middleware (not a static site), and it deploys via Vercel
  # — see `vercel.json` at the repo root, which is correct and current
  # (verified 2026-09-11). Left in place rather than silently rewritten;
  # decide deliberately whether to delete this block or repoint it.
  # ───────────────────────────────────────────────────────────────────────
  - type: web
    name: vojas-frontend
    plan: free
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://vojas-backend.onrender.com/api/v1
      - key: VITE_APP_NAME
        value: VOJAS
      - key: VITE_ENABLE_RQ_DEVTOOLS
        value: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true
