<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- VOJAS Symbol — Hexagonal V Mark with orbit ring -->
  <defs>
    <linearGradient id="hex" x1="14" y1="8" x2="50" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="v" x1="24" y1="20" x2="40" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- Orbit ring -->
  <circle cx="32" cy="32" r="28" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4 3" fill="none" opacity="0.5"/>
  <!-- Inner ring -->
  <circle cx="32" cy="32" r="22" stroke="#06b6d4" stroke-width="0.8" stroke-dasharray="2 4" fill="none" opacity="0.4"/>
  <!-- Hexagonal shield -->
  <path d="M32 8L50 18V38L32 52L14 38V18Z" stroke="url(#hex)" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <!-- V mark -->
  <path d="M24 38L32 20L40 38" stroke="url(#v)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Apex dot -->
  <circle cx="32" cy="32" r="2.5" fill="#67e8f9"/>
  <!-- Corner data nodes -->
  <circle cx="50" cy="18" r="1.5" fill="#22d3ee"/>
  <circle cx="14" cy="18" r="1.5" fill="#22d3ee"/>
  <circle cx="50" cy="38" r="1.5" fill="#06b6d4"/>
  <circle cx="14" cy="38" r="1.5" fill="#06b6d4"/>
</svg>
