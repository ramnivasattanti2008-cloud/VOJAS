<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 56" width="220" height="56">
  <!-- VOJAS Full Wordmark — Hexagonal V Mark + VOJAS text -->
  <defs>
    <linearGradient id="hex" x1="14" y1="8" x2="50" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="v" x1="24" y1="20" x2="40" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Icon area (left) -->
  <g transform="translate(0, 0)">
    <!-- Outer orbit ring -->
    <circle cx="28" cy="28" r="25" stroke="url(#orbit)" stroke-width="1.2" stroke-dasharray="3 2.5" fill="none"/>
    <!-- Hexagonal shield -->
    <path d="M28 7L43 15.5V34.5L28 46L13 34.5V15.5Z" stroke="url(#hex)" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
    <!-- V mark -->
    <path d="M21 34L28 18L35 34" stroke="url(#v)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Apex dot -->
    <circle cx="28" cy="28" r="2" fill="#22d3ee"/>
    <!-- Data nodes -->
    <circle cx="43" cy="15.5" r="1.2" fill="#22d3ee"/>
    <circle cx="13" cy="15.5" r="1.2" fill="#22d3ee"/>
  </g>

  <!-- Text area (right) -->
  <text x="62" y="34"
        font-family="system-ui, -apple-system, Inter, sans-serif"
        font-size="26"
        font-weight="800"
        letter-spacing="0.15em"
        fill="white">VOJAS</text>
  <text x="64" y="46"
        font-family="system-ui, -apple-system, Inter, sans-serif"
        font-size="10"
        font-weight="500"
        letter-spacing="0.3em"
        fill="#06b6d4"
        opacity="0.8">SPATIAL INTELLIGENCE</text>
</svg>
