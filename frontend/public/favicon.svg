<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- VOJAS Favicon — Hexagonal V Mark -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- Dark background -->
  <rect width="32" height="32" rx="6" fill="#070a10"/>
  <!-- Orbit ring -->
  <circle cx="16" cy="16" r="13" stroke="#06b6d4" stroke-width="1" stroke-dasharray="3 2" fill="none" opacity="0.4"/>
  <!-- Hexagonal shield -->
  <path d="M16 4L26 9V19L16 28L6 19V9Z"
        stroke="url(#g)" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
  <!-- V mark -->
  <path d="M12 19L16 10L20 19" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Apex dot -->
  <circle cx="16" cy="16" r="1.5" fill="#22d3ee"/>
</svg>
