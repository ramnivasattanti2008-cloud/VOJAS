# Nginx config for VOJAS frontend
# - Serves Vite static build from /usr/share/nginx/html
# - Proxies /api/* to the backend container
# - SPA fallback: any unmatched path returns index.html (React Router)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── API proxy → backend container ─────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Static assets (Vite-built JS/CSS/images) ─────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback: serve index.html for client-side routes ─────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Health endpoint ──────────────────────────────────────────────────
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
